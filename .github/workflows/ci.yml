name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pushes to main run one at a time, so a release always sees the previous release's tag.
# PR runs each get their own group and run in parallel.
concurrency:
  group: ${{ github.event_name == 'push' && 'main' || format('run-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: rust
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # Release jobs (prepare, build, publish): run on pushes to main with releasable commits.
  # See ADR-0002.
  prepare:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: git-cliff

      - name: Decide whether to release
        id: decide
        # Keep these patterns in line with the bump rules in cliff.toml.
        run: |
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$GITHUB_SHA" ]; then
            echo "Not the tip of main; the run for the newer commit releases."
            exit 0
          fi
          last_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          range=${last_tag:+$last_tag..}HEAD
          if git log --format=%s "$range" | grep -qE '^[a-z]+(\(.+\))?!:|^(feat|fix|perf)(\(.+\))?:' \
            || git log --format=%b "$range" | grep -qE '^BREAKING[ -]CHANGE:'; then
            echo "version=$(git-cliff --bumped-version)" >> "$GITHUB_OUTPUT"
          else
            echo "No releasable commits since ${last_tag:-the start}."
          fi

      - name: Write release notes
        if: steps.decide.outputs.version
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: git-cliff --unreleased --tag "$VERSION" --strip all > notes.md

      - if: steps.decide.outputs.version
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes.md
          if-no-files-found: error

  build:
    needs: prepare
    if: needs.prepare.outputs.version
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      ASSET: tijdje-${{ needs.prepare.outputs.version }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: rust

      - name: Build
        run: |
          if ! grep -qx 'version = "0.0.0"' Cargo.toml; then
            echo "::error::Cargo.toml must have version = \"0.0.0\" (see ADR-0002)."
            exit 1
          fi
          sed -i "0,/^version = \"0.0.0\"/s//version = \"${VERSION#v}\"/" Cargo.toml
          cargo build --release
          cp target/release/tijdje "$ASSET"
          sha256sum "$ASSET" > "$ASSET.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$VERSION" dist/tijdje-* \
            --target "$GITHUB_SHA" --title "$VERSION" --notes-file dist/notes.md
