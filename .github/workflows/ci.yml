name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: rust
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # Releases on pushes to main with releasable commits. See ADR-0002.
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: rust git-cliff

      - name: Decide whether to release
        id: decide
        # Keep these patterns in line with the bump rules in cliff.toml.
        run: |
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$GITHUB_SHA" ]; then
            echo "Not the tip of main; the run for the newer commit releases."
            exit 0
          fi
          last_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          range=${last_tag:+$last_tag..}HEAD
          if git log --format=%s "$range" | grep -qE '^[a-z]+(\(.+\))?!:|^(feat|fix|perf)(\(.+\))?:' \
            || git log --format=%b "$range" | grep -qE '^BREAKING[ -]CHANGE:'; then
            echo "version=$(git-cliff --bumped-version)" >> "$GITHUB_OUTPUT"
          else
            echo "No releasable commits since ${last_tag:-the start}."
          fi

      - name: Build
        if: steps.decide.outputs.version
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          if ! grep -qx 'version = "0.0.0"' Cargo.toml; then
            echo "::error::Cargo.toml must have version = \"0.0.0\" (see ADR-0002)."
            exit 1
          fi
          sed -i "0,/^version = \"0.0.0\"/s//version = \"${VERSION#v}\"/" Cargo.toml
          cargo build --release
          asset="tijdje-$VERSION-$TARGET"
          cp target/release/tijdje "$asset"
          sha256sum "$asset" > "$asset.sha256"

      - name: Publish release
        if: steps.decide.outputs.version
        env:
          VERSION: ${{ steps.decide.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git-cliff --unreleased --tag "$VERSION" --strip all > notes.md
          asset="tijdje-$VERSION-$TARGET"
          gh release create "$VERSION" "$asset" "$asset.sha256" \
            --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md
